help.instructions.header=\n----------------------------------------\n   SYSTEM NAVIGATION GUIDE & INSTRUCTIONS  \n----------------------------------------
help.instructions.title=This system manages crypto asset wallets and their transactions.\nBelow is the breakdown on how to navigate and use each menu:
help.instructions.wallet=1. WALLET MENU (Option 1 in Main Menu):\n   - Add Wallet: Register a new wallet by providing a unique ID, holder's name, and broker name.\n   - Search Wallet: Find and display details of a specific wallet using its ID.\n   - Edit Wallet: Update holder and broker information for an existing wallet.\n   - Remove Wallet: Permanently delete a wallet upon explicit user confirmation.
help.instructions.transaction=2. TRANSACTION MENU (Option 2 in Main Menu):\n   - Buy virtual coin: Add digital coins to a specified wallet balance (CASH_IN operation).\n   - Sell virtual coin: Withdraw digital coins from a specified wallet balance (CASH_OUT operation).\n   - Get virtual coin quote: Consult the daily coin price provided by the Oracle for a specific date.
help.instructions.reports=3. REPORTS MENU (Option 3 in Main Menu):\n   - Financial Report: Display wallet transactions with detailed calculations of expenses, revenues, current value, and profit/loss.\n   - List by ID: List registered wallets ordered by ascending ID.\n   - List by Holder: List registered wallets ordered alphabetically by holder name.\n   - Current Balance: Display wallet details and its total accumulated coin balance.\n   - Transaction History: Display chronological list of buys and sells for a wallet, including cash flows.\n   - Total Gain or Loss: Display coin balance and net accumulated financial gain or loss for each wallet.
help.instructions.tip=TIP: In any submenu, type '0' to return to the previous menu.

